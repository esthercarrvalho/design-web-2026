<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Prática Tailwind - Dia 2 [Atividade 1]</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
    
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl shadow-lg overflow-hidden border border-green-200">

    <img
      src="https://images.unsplash.com/photo-1509099836639-18ba1795216d?auto=format&fit=crop&w=800&q=80"
      alt="Premiação e troféu"
      class="w-full h-48 object-cover"
    />

    <div class="p-6 space-y-3">

      <span class="inline-block bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">
        Prêmio IEL 2026
      </span>

      <h2 class="text-2xl font-bold text-green-800">
        IFRN tem projetos entre os vencedores do Prêmio IEL 2026
      </h2>

      <p class="text-gray-700 text-base">
        Instituto conquistou o 1º lugar em Educação Inovadora - Nível Técnico
        e o 2º lugar em Educação Inovadora - Nível Superior.
      </p>

      <div class="flex flex-wrap gap-2 pt-2">

        <span class="bg-green-200 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">
          🏆 1º lugar
        </span>

        <span class="bg-green-200 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">
          🥈 2º lugar
        </span>

      </div>

    </div>
